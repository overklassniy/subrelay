<svg xmlns="http://www.w3.org/2000/svg"
     width="885" height="360" viewBox="0 0 885 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Subrelay</title>
  <desc id="hero-desc">Subrelay wordmark with a stylized relay broadcast: an enlarged tray icon at the center radiating concentric signal arcs, a lighter blue to the RU side and the icon blue to the non-RU side, with scattered proxy node dots.</desc>

  <defs>
    <radialGradient id="icon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3C5AA0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3C5AA0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="885" height="360" rx="20" fill="#0E1116"/>

  <!-- Title block (left) -->
  <g id="title-block" transform="translate(64 56)">
    <!-- Tray-icon motif: rounded square with two-lane split -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="none" stroke="#3C5AA0" stroke-width="1.5"/>
      <line x1="28" y1="8" x2="28" y2="48" stroke="#8B949E" stroke-width="1.5"/>
      <circle cx="14" cy="28" r="5" fill="#6B8AC8"/>
      <circle cx="42" cy="28" r="5" fill="#3C5AA0"/>
    </g>

    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="600" fill="#8B949E" letter-spacing="2">
      LOCAL PROXY RELAY MANAGER
    </text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="64" font-weight="700" fill="#E6EDF3">
      Subrelay
    </text>
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="400" fill="#E6EDF3">
      One VLESS subscription,
    </text>
    <text x="0" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="400" fill="#E6EDF3">
      live in your system tray.
    </text>

    <text x="0" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#8B949E">
      Go · sing-box · Fyne · Windows / Linux
    </text>
  </g>

  <!-- Relay broadcast composition (right) -->
  <g id="relay-broadcast" transform="translate(360 40)">
    <!-- Soft glow behind the central icon -->
    <circle cx="290" cy="140" r="120" fill="url(#icon-glow)"/>

    <!-- Concentric signal arcs: RU lane (lighter blue), radiating left from (260,140) -->
    <g stroke="#6B8AC8" fill="none" stroke-width="1.5">
      <path d="M260,90 A50,50 0 0 0 260,190" opacity="0.9"/>
      <path d="M260,60 A80,80 0 0 0 260,220" opacity="0.65"/>
      <path d="M260,30 A110,110 0 0 0 260,250" opacity="0.45"/>
      <path d="M260,0 A140,140 0 0 0 260,280" opacity="0.28"/>
    </g>

    <!-- Concentric signal arcs: Non-RU lane (icon blue), radiating right from (320,140) -->
    <g stroke="#3C5AA0" fill="none" stroke-width="1.5">
      <path d="M320,90 A50,50 0 0 1 320,190" opacity="0.9"/>
      <path d="M320,60 A80,80 0 0 1 320,220" opacity="0.65"/>
      <path d="M320,30 A110,110 0 0 1 320,250" opacity="0.45"/>
      <path d="M320,0 A140,140 0 0 1 320,280" opacity="0.28"/>
    </g>

    <!-- Scattered node dots: RU lane (lighter blue) -->
    <g fill="#6B8AC8">
      <circle cx="210" cy="140" r="3.5" opacity="0.9"/>
      <circle cx="216.7" cy="115" r="3" opacity="0.8"/>
      <circle cx="216.7" cy="165" r="3" opacity="0.8"/>
      <circle cx="180" cy="140" r="3.5" opacity="0.75"/>
      <circle cx="190.7" cy="100" r="3" opacity="0.7"/>
      <circle cx="190.7" cy="180" r="3" opacity="0.7"/>
      <circle cx="150" cy="140" r="3" opacity="0.6"/>
      <circle cx="156.6" cy="102.3" r="2.5" opacity="0.55"/>
      <circle cx="156.6" cy="177.7" r="2.5" opacity="0.55"/>
      <circle cx="120" cy="140" r="2.5" opacity="0.45"/>
      <circle cx="122" cy="115.7" r="2" opacity="0.4"/>
      <circle cx="122" cy="164.3" r="2" opacity="0.4"/>
    </g>

    <!-- Scattered node dots: Non-RU lane (icon blue) -->
    <g fill="#3C5AA0">
      <circle cx="370" cy="140" r="3.5" opacity="0.9"/>
      <circle cx="363.3" cy="115" r="3" opacity="0.8"/>
      <circle cx="363.3" cy="165" r="3" opacity="0.8"/>
      <circle cx="400" cy="140" r="3.5" opacity="0.75"/>
      <circle cx="389.3" cy="100" r="3" opacity="0.7"/>
      <circle cx="389.3" cy="180" r="3" opacity="0.7"/>
      <circle cx="430" cy="140" r="3" opacity="0.6"/>
      <circle cx="423.4" cy="102.3" r="2.5" opacity="0.55"/>
      <circle cx="423.4" cy="177.7" r="2.5" opacity="0.55"/>
      <circle cx="460" cy="140" r="2.5" opacity="0.45"/>
      <circle cx="458" cy="115.7" r="2" opacity="0.4"/>
      <circle cx="458" cy="164.3" r="2" opacity="0.4"/>
    </g>

    <!-- Central tray icon, enlarged -->
    <g>
      <rect x="230" y="80" width="120" height="120" rx="24" fill="#0E1116" stroke="#3C5AA0" stroke-width="2"/>
      <line x1="290" y1="92" x2="290" y2="188" stroke="#8B949E" stroke-width="1.5"/>
      <circle cx="260" cy="140" r="10" fill="#6B8AC8"/>
      <circle cx="320" cy="140" r="10" fill="#3C5AA0"/>
    </g>
  </g>
</svg>
