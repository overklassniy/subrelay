# Release workflow that builds subrelay for all supported Windows and
# Linux architectures and publishes distributable artifacts.
#
# Windows targets produce .exe files (zipped) with the embedded icon.
# Linux targets produce .deb, .rpm, and .tar.gz packages.
#
# The workflow runs on tag pushes matching "v*" and on manual dispatch.
# On tag pushes, a GitHub Release is created with all artifacts attached.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 1.0.0)'
        required: true
        default: '0.0.0-dev'
      create_release:
        description: 'Create a GitHub release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Build tags required by the sing-box extended fork.
  BUILD_TAGS: with_utls,with_grpc,with_quic

jobs:
  # -----------------------------------------------------------------
  # Windows builds: cross-compiled from ubuntu-latest using MinGW.
  # Produces subrelay-<version>-windows-<arch>.zip containing the .exe.
  # -----------------------------------------------------------------
  build-windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            mingw_prefix: x86_64-w64-mingw32
            deb_arch: amd64
            use_zig: false
          - goarch: arm64
            mingw_prefix: aarch64-w64-mingw32
            deb_arch: arm64
            use_zig: true
            zig_target: aarch64-windows-gnu
          - goarch: '386'
            mingw_prefix: i686-w64-mingw32
            deb_arch: i386
            use_zig: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MinGW cross-compilers
        if: matrix.use_zig != true
        run: |
          sudo apt-get update
          # Install the specific MinGW cross-compiler and binutils
          # for the target architecture. Ubuntu's gcc-mingw-w64
          # meta-package only includes x86-64 and i686 targets.
          sudo apt-get install -y \
            gcc-mingw-w64-${{ matrix.mingw_prefix == 'x86_64-w64-mingw32' && 'x86-64' || 'i686' }} \
            binutils-mingw-w64-${{ matrix.mingw_prefix == 'x86_64-w64-mingw32' && 'x86-64' || 'i686' }}

      - name: Install Zig for Windows arm64 cross-compilation
        if: matrix.use_zig == true
        run: |
          # Ubuntu does not ship an aarch64-w64-mingw32 MinGW
          # toolchain. Use Zig as the C cross-compiler instead.
          ZIG_VERSION="0.16.0"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Generate Windows icon resource for target architecture
        if: matrix.use_zig != true
        working-directory: cmd/subrelay
        run: |
          # Remove the pre-built .syso (built for amd64) and
          # regenerate it for the target architecture so the COFF
          # machine type matches the linker's expectation.
          rm -f resource.syso
          ${{ matrix.mingw_prefix }}-windres \
            --target=${{ matrix.mingw_prefix }} \
            -O coff \
            -o resource.syso \
            resource.rc
          echo "Generated resource.syso for ${{ matrix.mingw_prefix }}"

      - name: Remove pre-built resource.syso for Zig-based builds
        if: matrix.use_zig == true
        working-directory: cmd/subrelay
        run: |
          # The committed resource.syso targets amd64 Windows.
          # Remove it so Go does not link an incompatible object
          # into the arm64 binary. The arm64 build ships without
          # a custom Explorer icon.
          rm -f resource.syso

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.use_zig == true && format('zig cc -target {0}', matrix.zig_target) || format('{0}-gcc', matrix.mingw_prefix) }}
          CXX: ${{ matrix.use_zig == true && format('zig c++ -target {0}', matrix.zig_target) || format('{0}-g++', matrix.mingw_prefix) }}
        run: |
          mkdir -p build
          go build \
            -tags "${BUILD_TAGS}" \
            -ldflags "-H windowsgui -s -w -X subrelay/internal/update.CurrentVersion=${{ steps.version.outputs.version }}" \
            -o "build/subrelay-${{ steps.version.outputs.version }}-windows-${{ matrix.goarch }}.exe" \
            ./cmd/subrelay

      - name: Zip Windows artifact
        run: |
          cd build
          zip -j "subrelay-${{ steps.version.outputs.version }}-windows-${{ matrix.goarch }}.zip" \
            "subrelay-${{ steps.version.outputs.version }}-windows-${{ matrix.goarch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: subrelay-windows-${{ matrix.goarch }}
          path: build/subrelay-*.zip
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Linux builds: native (amd64) or cross-compiled using gcc
  # cross-toolchains and multiarch dev libraries.
  # Produces .deb, .rpm, and .tar.gz for each architecture.
  # -----------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            cc: gcc
            cgo_cflags: ''
            cgo_ldflags: ''
            pkg_config_path: ''
            apt_arch: ''
            apt_packages: ''
            apt_ports: false
            deb_arch: amd64
          - goarch: arm64
            goarm: ''
            cc: aarch64-linux-gnu-gcc
            cgo_cflags: ''
            cgo_ldflags: ''
            pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig
            apt_arch: arm64
            apt_packages: gcc-aarch64-linux-gnu
            apt_ports: true
            deb_arch: arm64
          - goarch: arm
            goarm: '7'
            cc: arm-linux-gnueabihf-gcc
            cgo_cflags: ''
            cgo_ldflags: ''
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig
            apt_arch: armhf
            apt_packages: gcc-arm-linux-gnueabihf
            apt_ports: true
            deb_arch: armhf
          - goarch: '386'
            goarm: ''
            cc: gcc
            cgo_cflags: '-m32'
            cgo_ldflags: '-m32'
            pkg_config_path: /usr/lib/i386-linux-gnu/pkgconfig
            apt_arch: i386
            apt_packages: gcc-multilib
            apt_ports: false
            deb_arch: i386
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev \
            xorg-dev \
            dpkg-dev rpm

      - name: Install cross-compiler and multiarch libraries
        if: matrix.apt_arch != ''
        run: |
          sudo dpkg --add-architecture ${{ matrix.apt_arch }}

          # On Ubuntu 24.04 the default apt sources only carry amd64
          # and i386 packages. For arm64 and armhf the package indices
          # must be fetched from ports.ubuntu.com instead.
          if [[ "${{ matrix.apt_ports }}" == "true" ]]; then
            # Restrict existing sources to amd64 so apt-get update
            # does not 404 on the foreign architecture. Add the
            # Architectures field to every stanza in the deb822
            # formatted sources file.
            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
              sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
            # Add ports.ubuntu.com sources for the foreign arch.
            sudo tee /etc/apt/sources.list.d/ports.sources > /dev/null <<EOF
          Types: deb
          Architectures: ${{ matrix.apt_arch }}
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          Architectures: ${{ matrix.apt_arch }}
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          fi

          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}
          sudo apt-get install -y \
            libgl1-mesa-dev:${{ matrix.apt_arch }} \
            libegl1-mesa-dev:${{ matrix.apt_arch }} \
            libxkbcommon-dev:${{ matrix.apt_arch }} \
            libwayland-dev:${{ matrix.apt_arch }} \
            libx11-dev:${{ matrix.apt_arch }} \
            libxcursor-dev:${{ matrix.apt_arch }} \
            libxrandr-dev:${{ matrix.apt_arch }} \
            libxinerama-dev:${{ matrix.apt_arch }} \
            libxi-dev:${{ matrix.apt_arch }} \
            libxxf86vm-dev:${{ matrix.apt_arch }}

      - name: Remove Windows resource file before Linux build
        working-directory: cmd/subrelay
        run: |
          # The committed resource.syso is an amd64 Windows COFF
          # object. Go automatically links .syso files found in the
          # package directory. On non-amd64 targets this causes an
          # architecture mismatch at link time, so remove it.
          rm -f resource.syso

      - name: Install fpm for .rpm packaging
        run: |
          sudo gem install fpm --no-document

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: |
          mkdir -p build
          go build \
            -tags "${BUILD_TAGS}" \
            -ldflags "-s -w -X subrelay/internal/update.CurrentVersion=${{ steps.version.outputs.version }}" \
            -o "build/subrelay-${{ steps.version.outputs.version }}-linux-${{ matrix.goarch }}" \
            ./cmd/subrelay

      - name: Package Linux artifacts
        run: |
          chmod +x packaging/package-linux.sh
          packaging/package-linux.sh \
            "build/subrelay-${{ steps.version.outputs.version }}-linux-${{ matrix.goarch }}" \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "build"

      - uses: actions/upload-artifact@v4
        with:
          name: subrelay-linux-${{ matrix.goarch }}
          path: |
            build/subrelay-*.deb
            build/subrelay-*.rpm
            build/subrelay-*.tar.gz
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Release job: collects all artifacts and creates a GitHub Release.
  # Only runs on tag pushes or when explicitly requested via
  # workflow_dispatch with create_release=true.
  # -----------------------------------------------------------------
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Subrelay ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/subrelay-*.zip
            artifacts/subrelay-*.deb
            artifacts/subrelay-*.rpm
            artifacts/subrelay-*.tar.gz
